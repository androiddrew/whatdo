name: Release

# Pushing a version tag (vX.Y.Z) publishes the cpu + cuda images to Docker Hub.
#
# Auth uses two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a
# Docker Hub access token with read/write/delete on the androiddrew namespace).
# Set them under Settings → Secrets and variables → Actions.
on:
  push:
    tags:
      # Glob filter (not regex): `+` = one-or-more of the preceding char, `.` is
      # literal — matches v1.2.3, v10.20.30; excludes pre-release suffixes.
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/androiddrew/whatdo

jobs:
  publish-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        accel: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute version and image tags
        id: meta
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$version-${{ matrix.accel }}"
            echo "$IMAGE:${{ matrix.accel }}"
            # cpu is the trim default: it also carries the unsuffixed version + latest.
            if [ "${{ matrix.accel }}" = "cpu" ]; then
              echo "$IMAGE:$version"
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the ${{ matrix.accel }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ACCEL=${{ matrix.accel }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
