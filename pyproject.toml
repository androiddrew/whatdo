[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "whatdo"
description = "A Typesafe-compatible Jev API server backed by the Laya decision engine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Drew Bednar" }]
# Runtime deps are declared inline (PEP 621); uv.lock pins them for reproducible,
# cross-platform installs. Only the version stays dynamic (setuptools-scm, from
# git tags). See ADR-0006 (supersedes ADR-0002).
dynamic = ["version"]

dependencies = [
    "click>=8.1",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    # The Laya engine ships with every install: it is the default engine
    # (ADR-0007). `laya` always resolves from PyPI; the fork is a Docker
    # build-time option (LAYA_FORK), never a package dependency, so whatdo stays
    # publish-ready (no direct-reference deps in published metadata).
    "laya==0.3.4",
    # Plain pip gets PyPI's torch (CUDA-bundled on Linux, CPU/MPS on macOS);
    # the accelerator extras below only choose a different wheel.
    "torch==2.14.0",
]

# `whatdo serve` starts the API server (see src/whatdo/cli.py).
[project.scripts]
whatdo = "whatdo.cli:main"

[project.optional-dependencies]
# Optional OpenTelemetry stack for the `whatdo[otel]` extra, imported lazily
# behind the observability toggle and absent from the base install.
otel = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
]
# Accelerator extras (ADR-0001 / ADR-0006 / ADR-0007): the same torch version as
# the base dependency, with the wheel selected per accelerator via
# [tool.uv.sources]. cpu/cuda are mutually exclusive (see [tool.uv].conflicts).
cpu = ["torch==2.14.0"]
cuda = ["torch==2.14.0"]
# Documented, unbuilt slots (ADR-0001) — plain deps, no direct URLs:
# rocm = ["torch==2.14.0"]
# jetson = ["torch==2.14.0"]

[dependency-groups]
# PEP 735 groups: local/CI tooling, never shipped as part of the package.
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "build",
    # The official Typesafe SDK: drives the contract tests (FakeEngine, no GPU).
    "typesafe-sdk",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://github.com/androiddrew/whatdo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

# uv-only dependency sources (local/dev config; stripped from the built wheel, so
# this stays publish-safe). Selects the torch wheel per accelerator: the cpu extra
# pulls torch from the PyTorch CPU index; cuda uses the default PyPI torch (which
# bundles the cu13 nvidia wheels). Non-uv consumers pass --extra-index-url instead
# (see the README install commands). Future: a `pytorch-rocm` index for rocm.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[tool.uv]
# cpu and cuda cannot be installed together; resolve each independently in the lock.
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/whatdo"]

# `laya` ships no type information. `torch` is typed, but kept here so a
# checkout synced without it still typechecks (both are imported lazily).
[[tool.mypy.overrides]]
module = ["laya", "laya.*", "torch", "torch.*"]
ignore_missing_imports = true

# OpenTelemetry is the optional `[otel]` extra, imported lazily behind the master
# toggle; absent in the base install (and CI), so let mypy treat it as untyped.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: real-model tests requiring a GPU; run locally via `make test-slow`, not in CI",
]
