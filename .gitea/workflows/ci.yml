name: CI

on:
  # Run on direct pushes to main (post-merge / protected branch) and on PRs.
  # Scoping push to main avoids double runs: a feature branch with an open PR
  # would otherwise trigger both `push` and `pull_request` for the same commit.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git history/tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: make setup
      - run: make lint
      - run: make typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: make setup
      - run: make test

  # The OTEL-on tests importorskip when the extra is absent, so run them in a
  # job that installs laya-server[otel] to actually exercise emission (#8).
  test-otel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: make setup
      - run: make test-otel

  # Build the cpu and cuda images (ADR-0001). Building needs no GPU; images are
  # built but not pushed here (publishing is ticket #10).
  build-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        accel: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.accel }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ACCEL=${{ matrix.accel }}
          push: false
          tags: laya-server:${{ matrix.accel }}
