name: Release

# Pushing a version tag (vX.Y.Z) publishes the package to the Gitea PyPI
# registry and the cpu + cuda images to the Gitea container registry (#10).
#
# Auth uses the runner's built-in ${{ secrets.GITEA_TOKEN }} with ${{ github.actor }}
# as the username (Gitea's documented registry-auth pattern). The identity must
# have package read/write on androiddrew; if your deployment's built-in token
# lacks package scope, or its user differs from the tag-pusher, set a PAT secret
# (and matching username) and swap them in below.
on:
  push:
    tags:
      # Glob filter (not regex): `+` = one-or-more of the preceding char, `.` is
      # literal — matches v1.2.3, v10.20.30; excludes pre-release suffixes.
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: git.runcible.io/androiddrew/laya-server
  PYPI_UPLOAD_URL: https://git.runcible.io/api/packages/androiddrew/pypi
  PYPI_SIMPLE_URL: https://git.runcible.io/api/packages/androiddrew/pypi/simple/

jobs:
  publish-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the pushed tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Build sdist + wheel
        run: make dist
      - name: Publish to the Gitea PyPI registry
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITEA_TOKEN }}
          TWINE_REPOSITORY_URL: ${{ env.PYPI_UPLOAD_URL }}
        run: uvx twine upload --non-interactive dist/*

  publish-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        accel: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: git.runcible.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITEA_TOKEN }}
      - name: Compute version and image tags
        id: meta
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$version-${{ matrix.accel }}"
            echo "$IMAGE:${{ matrix.accel }}"
            # cpu is the trim default: it also carries the unsuffixed version + latest.
            if [ "${{ matrix.accel }}" = "cpu" ]; then
              echo "$IMAGE:$version"
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the ${{ matrix.accel }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ACCEL=${{ matrix.accel }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # Criterion #4: prove `pip install "laya-server[otel]"` resolves from the
  # registry (base package from Gitea, otel deps from PyPI) after publishing.
  verify-install:
    runs-on: ubuntu-24.04
    needs: publish-package
    steps:
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Resolve laya-server[otel] from the Gitea PyPI registry
        env:
          # netrc keeps the token out of the index URL and the command line.
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          printf 'machine git.runcible.io\n  login %s\n  password %s\n' \
            "$REGISTRY_USER" "$REGISTRY_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          uv venv /tmp/verify
          # unsafe-best-match: base package from Gitea, otel deps from PyPI.
          uv pip install --python /tmp/verify \
            --index-strategy unsafe-best-match \
            --extra-index-url "$PYPI_SIMPLE_URL" \
            "laya-server[otel]==$version"
          /tmp/verify/bin/python -c "import laya_server, opentelemetry.sdk; print('resolved laya-server[otel]', '$version')"
          rm -f "$HOME/.netrc"
